name: Bug report
description: Tell us about a reproducible problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove secrets
        and personal data before submitting logs or configuration.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this with the latest commit on `main` or I have included the exact version tested.
          required: true
        - label: I have removed credentials, tokens, and other sensitive data from this report.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observable behavior and its impact.
      placeholder: Tell us what went wrong and who is affected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest complete sequence of commands or requests that reproduces the problem.
      placeholder: |
        1. Start the service with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message or response when possible.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traces
      description: Paste only the relevant lines. Redact secrets and personal data.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Give us enough context to reproduce the issue.
      value: |
        - Commit, tag, or image:
        - Go version (if running on the host):
        - OS and architecture:
        - Docker/Compose version (if applicable):
        - Database version and deployment mode:
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add links, screenshots, or a possible fix if they help explain the issue.
