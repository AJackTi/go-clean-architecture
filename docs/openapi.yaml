openapi: 3.1.0
info:
  title: Go Clean Architecture API
  version: 0.1.0
  description: |
    A small production-oriented HTTP API used as the example vertical slice
    for this Go template. The API is intentionally versioned under `/api/v1`
    for domain resources. Operational probes remain unversioned so deployment
    tooling can keep using them across API revisions.
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
# Authentication is an opt-in runtime policy. The Bearer scheme documents the
# header and reusable 401 response without making a fresh checkout require it;
# enablement is controlled by AUTH_ENABLED.
security: []
tags:
  - name: Operations
    description: Process liveness and dependency readiness probes.
  - name: Items
    description: The example Item vertical slice.
paths:
  /api/health:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Check process liveness
      description: >-
        Returns `ok` when the process is serving requests. This probe does not
        contact PostgreSQL and may remain healthy while readiness is degraded.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              example:
                status: ok

  /api/healthz:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Check dependency readiness
      description: >-
        Performs a PostgreSQL readiness check with a two-second deadline. A
        failed or missing dependency check fails closed with HTTP 503.
      responses:
        '200':
          description: Required dependencies are available.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessOKResponse'
              example:
                status: ok
        '503':
          description: A required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessUnavailableResponse'
              example:
                status: unavailable

  /api/v1/items:
    x-authentication:
      optional: true
      enabled-by: AUTH_ENABLED
    parameters:
      - $ref: '#/components/parameters/RequestID'
    post:
      tags: [Items]
      operationId: createItem
      summary: Create an item
      description: >-
        Creates an Item. The server owns the UUIDv4 identity and UTC creation
        time. Name and description are edge-trimmed before domain validation.
        Request JSON is strict: unknown fields, malformed JSON, trailing JSON
        values, and bodies larger than 1 MiB are rejected with HTTP 400.
        Supplying one `Idempotency-Key` makes the create safe to retry for the
        24-hour retention window. The fingerprint is computed from the
        canonical (trimmed) name and description. A replay returns the same
        Item, body, and `Location` with HTTP 200 and
        `Idempotency-Replayed: true`; a different payload for a retained key
        returns HTTP 409. Requests using the same key concurrently are
        serialized by the persistence adapter; a request that cannot acquire
        the key returns HTTP 409 with `Retry-After`.
      x-idempotency:
        supported: true
        key-header: Idempotency-Key
        fingerprint: sha-256 of canonical name and description
        retention: 24h after successful completion
        scope: authenticated principal, or direct peer address when auth is disabled
        privacy: raw keys, scopes, and fingerprints are hashed before storage; the validated key is echoed only in successful keyed response headers and never logged or included in error bodies
      x-request-body-max-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
            example:
              name: Mechanical keyboard
              description: Hot-swappable
      responses:
        '200':
          description: The create was replayed from a retained idempotency record.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKeyReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              required: true
              description: Relative URL of the original Item.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/items/c80c1043-a6cd-42bf-984e-0191352f4b26
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDataResponse'
              example:
                data:
                  id: c80c1043-a6cd-42bf-984e-0191352f4b26
                  name: Mechanical keyboard
                  description: Hot-swappable
                  created_at: '2026-08-09T12:30:00Z'
        '201':
          description: Item created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Location:
              required: true
              description: Relative URL of the newly created Item.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/items/c80c1043-a6cd-42bf-984e-0191352f4b26
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDataResponse'
              example:
                data:
                  id: c80c1043-a6cd-42bf-984e-0191352f4b26
                  name: Mechanical keyboard
                  description: Hot-swappable
                  created_at: '2026-08-09T12:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequestBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CreateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/IdempotencyUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    get:
      tags: [Items]
      operationId: listItems
      summary: List items
      description: >-
        Returns a deterministic newest-first page ordered by
        `created_at DESC, id DESC`. The service requests one look-ahead row to
        calculate `meta.has_more`. Offset pagination is not a snapshot.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of items. `data` is always an array, including when empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
              example:
                data:
                  - id: 15709605-fde8-49ce-b867-c9af294f2bf5
                    name: Mechanical keyboard
                    description: Hot-swappable
                    created_at: '2026-08-09T12:30:00Z'
                meta:
                  limit: 20
                  offset: 0
                  has_more: false
        '400':
          $ref: '#/components/responses/BadRequestPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/items/{id}:
    x-authentication:
      optional: true
      enabled-by: AUTH_ENABLED
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      tags: [Items]
      operationId: getItem
      summary: Fetch an item
      description: Fetches one Item by its UUID identity.
      parameters:
        - $ref: '#/components/parameters/ItemID'
      responses:
        '200':
          description: The requested item.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDataResponse'
              example:
                data:
                  id: 0f3f84c5-64b7-4df5-a6a6-fe07f97a85ed
                  name: Mechanical keyboard
                  description: Quiet switches
                  created_at: '2026-08-09T12:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequestItemID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: >-
        Optional service-to-service credential. Runtime enablement is controlled
        by AUTH_ENABLED; replace the starter verifier with OIDC/JWT/JWKS for
        end-user identity and authorization.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >-
        Optional correlation token. A single HTTP token of at most 128 ASCII
        bytes is preserved; missing, malformed, oversized, or duplicate values
        are replaced by the server with a UUIDv4.
      schema:
        type: string
        maxLength: 128
        pattern: "^[-A-Za-z0-9!#$%&'*+.^_`|~]{1,128}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional request token. It must contain exactly one HTTP token value of
        1–255 ASCII bytes. Duplicate, empty, whitespace, control, non-ASCII, or
        oversized values are rejected with HTTP 400. The server hashes the
        value and combines it with the caller scope. The validated token may be
        echoed in a successful response header, but is never persisted, logged,
        or included in an error body.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    ItemID:
      name: id
      in: path
      required: true
      description: UUID identity assigned by the server.
      schema:
        type: string
        format: uuid
      example: 0f3f84c5-64b7-4df5-a6a6-fe07f97a85ed
    Limit:
      name: limit
      in: query
      required: false
      allowEmptyValue: true
      description: >-
        Number of items to return. Omitted, empty, or zero uses the default of
        20. Values from 1 through 100 are accepted; values above 100 are
        rejected.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        default: 20
      example: 20
    Offset:
      name: offset
      in: query
      required: false
      allowEmptyValue: true
      description: Zero-based number of items to skip. Omitted or empty means 0.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      example: 0
  headers:
    RequestID:
      required: true
      description: >-
        Correlation token assigned to this response. It is either the accepted
        upstream token or a server-generated canonical UUIDv4.
      schema:
        type: string
        maxLength: 128
        pattern: "^[-A-Za-z0-9!#$%&'*+.^_`|~]{1,128}$"
    IdempotencyKey:
      required: false
      description: The accepted idempotency token, echoed when a keyed create succeeds.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IdempotencyKeyReplay:
      required: true
      description: The accepted idempotency token associated with the replayed create.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IdempotencyReplayed:
      required: true
      description: Indicates that the response was replayed from a retained idempotency record.
      schema:
        type: string
        const: 'true'
    RetryAfter:
      required: false
      description: Minimum number of seconds before retrying an in-progress idempotent request.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequestBody:
      description: The request body is missing, malformed, too large, or not strict JSON.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: invalid request body
    BadRequestItemID:
      description: The path parameter is not a valid non-zero UUID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: invalid item id
    BadRequestPagination:
      description: A pagination query parameter is malformed or outside its allowed range.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: invalid pagination parameters
    ValidationError:
      description: The Item violates a domain invariant.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: invalid item
    NotFound:
      description: The requested Item does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: item not found
    Conflict:
      description: The Item conflicts with existing state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: item already exists
    CreateConflict:
      description: >-
        The create conflicts with existing state. `idempotency_conflict` means
        the retained key was used with a different canonical payload;
        `idempotency_in_progress` means another request is currently processing
        the key and clients should retry after the advertised delay.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotencyConflict:
              value:
                error:
                  code: idempotency_conflict
                  message: idempotency key was used with a different request
            idempotencyInProgress:
              value:
                error:
                  code: idempotency_in_progress
                  message: idempotency request is still in progress
    IdempotencyUnavailable:
      description: The requested idempotency capability is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: idempotency_unavailable
              message: idempotent create is temporarily unavailable
    InternalError:
      description: An internal dependency failed; provider details are not exposed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: internal server error
    Unauthorized:
      description: Authentication is enabled and the Bearer credential is missing or invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          description: Bearer authentication challenge.
          required: true
          schema:
            type: string
            const: 'Bearer realm="api"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: valid bearer credentials are required
    TooManyRequests:
      description: The optional in-process rate limiter has rejected the request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Minimum number of seconds before retrying.
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        RateLimit-Remaining:
          description: Tokens remaining for the selected key.
          required: true
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: request rate limit exceeded
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [id, name, description, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated RFC 4122 UUIDv4 identity.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: c80c1043-a6cd-42bf-984e-0191352f4b26
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Edge-trimmed Unicode label.
          example: Mechanical keyboard
        description:
          type: string
          maxLength: 2000
          description: Edge-trimmed optional Unicode text; an omitted value is returned as an empty string.
          example: Hot-swappable
        created_at:
          type: string
          format: date-time
          description: Server-assigned immutable UTC creation instant.
          example: '2026-08-09T12:30:00Z'
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: >-
            Required Unicode label. The server trims Unicode whitespace at both
            edges, then requires 1–120 Unicode characters in the canonical value.
          x-normalized-min-length: 1
          x-normalized-max-length: 120
        description:
          type: string
          description: >-
            Optional Unicode text. The server trims Unicode whitespace at both
            edges, then permits at most 2,000 Unicode characters in the
            canonical value.
          x-normalized-max-length: 2000
    ItemDataResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Item'
    ItemListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageMeta:
      type: object
      additionalProperties: false
      required: [limit, offset, has_more]
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Normalized page size.
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Normalized zero-based offset.
        has_more:
          type: boolean
          description: Whether another item exists after this page.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation_error, not_found, conflict, idempotency_conflict, idempotency_in_progress, idempotency_unavailable, unauthorized, rate_limited, internal_error]
          description: Stable machine-readable error code.
        message:
          type: string
          minLength: 1
          description: Stable sanitized human-readable message.
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessOKResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessUnavailableResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: unavailable
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]{1,255}$"
      description: HTTP token used to safely retry a create request.
