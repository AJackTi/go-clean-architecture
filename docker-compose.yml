name: ${COMPOSE_PROJECT_NAME:-go-clean-architecture}

services:
  postgres:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set (copy .env.example to .env)}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set (copy .env.example to .env)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: "${APP_IMAGE:-go-clean-architecture:local}"
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set (copy .env.example to .env)}"
      MIGRATIONS_PATH: file:///app/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: "${APP_IMAGE:-go-clean-architecture:local}"
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: "${APP_ENV:-development}"
      HTTP_PORT: "${HTTP_PORT:-8080}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set (copy .env.example to .env)}"
      METRICS_ENABLED: "${METRICS_ENABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-github.com/AJackTi/go-clean-architecture}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-false}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_BEARER_TOKEN_SHA256: "${AUTH_BEARER_TOKEN_SHA256:-}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_REQUESTS_PER_SECOND: "${RATE_LIMIT_REQUESTS_PER_SECOND:-10}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
      RATE_LIMIT_MAX_CLIENTS: "${RATE_LIMIT_MAX_CLIENTS:-10000}"
      RATE_LIMIT_IDLE_TTL: "${RATE_LIMIT_IDLE_TTL:-10m}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
